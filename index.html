<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stunt Driver</title>
    <style>
      /* Fill the whole browser window with the game, no scrollbars. */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #87b7e0;
        font-family: system-ui, sans-serif;
      }
      /* The 3D game draws onto this canvas. It fills the screen. */
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- Three.js draws the 3D world onto this canvas. -->
    <canvas id="game"></canvas>
    <!-- main.js is the heart of the game. It starts everything. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
